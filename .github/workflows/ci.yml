name: Physical CI with WidowX

on:
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  simulate:
    name: "Simulation Collision Check"
    runs-on: mymac
    container:
      image: depetrol/physical-ci:latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build
        shell: bash -l {0}
        run: lfc src/parallel.lf

      - name: Run
        shell: bash -l {0}
        run: ./bin/parallel

  execute:
    name: "Execution"
    needs: simulate
    runs-on: mymac
    container:
      image: depetrol/physical-ci:latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build
        shell: bash -l {0}
        run: lfc src/parallel.lf

      - name: Run
        shell: bash -l {0}
        run: ./bin/parallel
