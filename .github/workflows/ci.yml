name: Physical CI with WidowX

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: self-hosted

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and Run Parallel
        shell: bash -l {0}
        run: |
          lfc-dev src/parallel.lf
          ./bin/parallel