name: Collision detection check

on:
  workflow_dispatch:

jobs:
  collide:
    name: "Arm into the floor"
    runs-on: mymac
    container:
      image: depetrol/lingua-franca:latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build
        shell: bash -l {0}
        run: lfc src/collide.lf

      - name: Run
        shell: bash -l {0}
        run: ./bin/collide
