name: Collision detection check

on:
  workflow_dispatch:

jobs:
  build-lfc:
    name: "Build lfc"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out lingua-franca
        uses: actions/checkout@v4
        with:
          repository: lf-lang/lingua-franca
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build lfc
        run: ./gradlew --no-daemon :cli:lfc:installDist

      # Artifact uploads drop file permissions; the tarball keeps bin/lfc executable.
      - name: Package lfc
        run: tar -czf lfc.tar.gz -C cli/lfc/build/install lfc

      - name: Upload lfc
        uses: actions/upload-artifact@v7
        with:
          name: lfc
          path: lfc.tar.gz
          retention-days: 7
          overwrite: true # artifacts are immutable; a re-run of this job replaces the previous attempt's lfc

  collide:
    name: "Arm into the floor"
    needs: build-lfc
    runs-on: lf-thor-sim
    timeout-minutes: 5
    container:
      image: depetrol/physical-ci:latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download lfc
        uses: actions/download-artifact@v8
        with:
          name: lfc

      - name: Install lfc
        run: tar -xzf lfc.tar.gz -C /opt

      - name: Build
        shell: bash -l {0}
        run: /opt/lfc/bin/lfc src/collide.lf

      - name: Run
        shell: bash -l {0}
        run: ./bin/collide

      # Runs whatever happened to the program: failure, cancellation or the job timeout. A program
      # from a cancelled step may still hold the arm, so end it first, then clear any controller
      # error and park the arm.
      - name: Return the arm to its home position
        if: always()
        shell: bash -l {0}
        run: |
          pkill -f src-gen/ || true
          python3 examples/home.py
