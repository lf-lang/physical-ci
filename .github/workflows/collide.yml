name: Collision detection check

on:
  workflow_dispatch:

# Runs src/collide.lf, which drives the simulated arm into the floor, and
# passes only if that run fails: the simulation must fault the controller so
# that the driver raises and the program exits non-zero. Runs on the
# simulation runner only.
jobs:
  collide:
    name: "Arm into the floor must fail"
    runs-on: mymac
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build
        shell: bash -l {0}
        run: lfc src/collide.lf

      - name: Run and expect a collision fault
        shell: bash -l {0}
        run: |
          if ./bin/collide; then
            echo "::error::collide finished without the collision being detected"
            exit 1
          fi
          echo "Collision detected: the program failed as expected"
